<div class="lb-overlay" id="lb" aria-hidden="true">
  <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
  <img id="lb-img" alt="">
  <div class="lb-hint" id="lb-hint">Click / scroll or pinch to zoom · drag to pan · Esc to close</div>
</div>

<script>
(function () {
  var overlay = document.getElementById('lb');
  var img = document.getElementById('lb-img');
  var hint = document.getElementById('lb-hint');

  var scale = 1, tx = 0, ty = 0;
  var minScale = 1, maxScale = 6;

  
  function bestSrc(el) {
    if (el.dataset.full) return el.dataset.full;
    var best = el.currentSrc || el.src, bestW = 0;
    if (el.srcset) {
      el.srcset.split(',').forEach(function (part) {
        var m = part.trim().match(/(\S+)\s+(\d+)w/);
        if (m && +m[2] > bestW) { bestW = +m[2]; best = m[1]; }
      });
    }
    return best;
  }

  function apply() {
    img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    overlay.classList.toggle('lb-zoomed', scale > 1.01);
  }

  function reset() { scale = 1; tx = 0; ty = 0; apply(); }

  
  function clamp() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = img.clientWidth * scale, h = img.clientHeight * scale;
    var maxX = Math.max(0, (w - vw) / 2), maxY = Math.max(0, (h - vh) / 2);
    tx = Math.min(maxX, Math.max(-maxX, tx));
    ty = Math.min(maxY, Math.max(-maxY, ty));
  }

  function open(src, alt) {
    img.src = src;
    img.alt = alt || '';
    reset();
    overlay.classList.add('lb-open');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    hint.style.display = '';
  }

  function close() {
    overlay.classList.remove('lb-open');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    img.src = '';
  }

  
  function zoomAt(px, py, factor) {
    var prev = scale;
    scale = Math.min(maxScale, Math.max(minScale, scale * factor));
    var f = scale / prev;
    
    var cx = window.innerWidth / 2 + tx;
    var cy = window.innerHeight / 2 + ty;
    tx += (px - cx) * (1 - f);
    ty += (py - cy) * (1 - f);
    if (scale <= 1.01) { tx = 0; ty = 0; }
    clamp();
    apply();
  }

  
  document.querySelectorAll('.entry-cover img, .post-content img').forEach(function (el) {
    
    el.style.cursor = 'zoom-in';
    el.addEventListener('click', function (e) {
      e.preventDefault();
      open(bestSrc(el), el.alt);
    });
  });
  
  document.querySelectorAll('.entry-cover a').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); });
  });

  document.getElementById('lb-close').addEventListener('click', close);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) close();
  });
  document.addEventListener('keydown', function (e) {
    if (!overlay.classList.contains('lb-open')) return;
    if (e.key === 'Escape') close();
  });

  
  img.addEventListener('click', function (e) {
    e.stopPropagation();
    if (scale > 1.01) reset();
    else zoomAt(e.clientX, e.clientY, 2.5);
    hint.style.display = 'none';
  });

  
  overlay.addEventListener('wheel', function (e) {
    if (!overlay.classList.contains('lb-open')) return;
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 0.87);
    hint.style.display = 'none';
  }, { passive: false });

  
  var dragging = false, startX = 0, startY = 0, baseX = 0, baseY = 0;
  img.addEventListener('mousedown', function (e) {
    if (scale <= 1.01) return;
    dragging = true; startX = e.clientX; startY = e.clientY; baseX = tx; baseY = ty;
    overlay.classList.add('lb-panning');
    e.preventDefault();
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    tx = baseX + (e.clientX - startX);
    ty = baseY + (e.clientY - startY);
    clamp(); apply();
  });
  window.addEventListener('mouseup', function () {
    dragging = false; overlay.classList.remove('lb-panning');
  });

  
  var touchStart = null, pinchDist = 0, pinchMid = null, baseScale = 1;
  function dist(t) {
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.hypot(dx, dy);
  }
  function mid(t) {
    return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 };
  }
  overlay.addEventListener('touchstart', function (e) {
    if (e.touches.length === 1) {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: tx, ty: ty };
    } else if (e.touches.length === 2) {
      pinchDist = dist(e.touches);
      pinchMid = mid(e.touches);
      baseScale = scale;
      touchStart = null;
    }
    hint.style.display = 'none';
  }, { passive: false });
  overlay.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2 && pinchDist) {
      e.preventDefault();
      var prev = scale;
      scale = Math.min(maxScale, Math.max(minScale, baseScale * (dist(e.touches) / pinchDist)));
      var f = scale / prev;
      var cx = window.innerWidth / 2 + tx, cy = window.innerHeight / 2 + ty;
      tx += (pinchMid.x - cx) * (1 - f);
      ty += (pinchMid.y - cy) * (1 - f);
      if (scale <= 1.01) { tx = 0; ty = 0; }
      clamp(); apply();
    } else if (e.touches.length === 1 && touchStart && scale > 1.01) {
      e.preventDefault();
      tx = touchStart.tx + (e.touches[0].clientX - touchStart.x);
      ty = touchStart.ty + (e.touches[0].clientY - touchStart.y);
      clamp(); apply();
    }
  }, { passive: false });
  overlay.addEventListener('touchend', function (e) {
    if (e.touches.length < 2) pinchDist = 0;
    if (e.touches.length === 0) touchStart = null;
  });

  window.addEventListener('resize', function () {
    if (overlay.classList.contains('lb-open')) { clamp(); apply(); }
  });
})();
</script>
