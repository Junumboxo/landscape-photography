backend:
  name: github
  repo: Junumboxo/landscape-photography
  branch: main
  # base_url points at the OAuth handler (a small Cloudflare Worker — see docs).
  # Update the host below to your deployed worker URL.
  base_url: https://landscapes-cms-auth.tatiana-barbova.workers.dev

# Photos are page bundles, so media is stored alongside each entry by default.
# These top-level values are the fallback for collections that don't override them.
media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  - name: "photos"
    label: "Photos"
    label_singular: "Photo"
    folder: "content/photos"
    create: true
    # Store each photo as a page bundle: content/photos/<slug>/index.md
    path: "{{slug}}/index"
    # Uploaded images land in the same folder as the entry (the bundle).
    media_folder: ""
    public_folder: ""
    slug: "{{slug}}"
    summary: "{{title}} — {{year}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Locations"
        name: "locations"
        widget: "list"
        field: { label: "Location", name: "location", widget: "string" }
      - label: "Years"
        name: "years"
        widget: "list"
        field: { label: "Year", name: "year", widget: "string" }
      - label: "Cover"
        name: "cover"
        widget: "object"
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Alt text", name: "alt", widget: "string", required: false }
          - { label: "Relative", name: "relative", widget: "hidden", default: true }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Caption / notes", name: "body", widget: "markdown", required: false }

  - name: "posts"
    label: "Blog posts"
    label_singular: "Post"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
